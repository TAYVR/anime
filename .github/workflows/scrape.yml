name: AnimeLek Auto Scraper

on:
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours

  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write   # needed to push commits

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h limit for the job

    steps:
      # ── 1. Checkout repo ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for git push
          token: ${{ secrets.GITHUB_TOKEN }}   # Use built-in token instead of manual PAT

      # ── 2. Set up Python -------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run scraper ---------------------------------------------------
      - name: Run AnimeLek scraper
        run: timeout 5h python scraper.py || true
        env:
          # No secret keys needed — uses only free public scraping
          PYTHONUNBUFFERED: "1"

      # ── 5. Commit & push data -------------------------------------------
      - name: Commit and push scraped data
        run: python push_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
