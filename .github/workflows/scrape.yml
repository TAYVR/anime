name: AnimeLek Auto Scraper

on:
  # Run every 5 hours 30 minutes
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours  (closest cron allows)
    # Note: GitHub Actions cron minimum is 5min intervals.
    # True 5h30 isn't expressible in a single cron line, so we
    # combine two schedules: run at :00 and :30 of every 5th hour.
    - cron: "30 4,9,14,19 * * *"   # 04:30 / 09:30 / 14:30 / 19:30 UTC daily

  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write   # needed to push commits

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 320   # 5h20 safety cap

    steps:
      # ── 1. Checkout repo ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for git push
          token: ${{ secrets.GITHUB_TOKEN }}   # Use built-in token instead of manual PAT

      # ── 2. Set up Python -------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run scraper ---------------------------------------------------
      - name: Run AnimeLek scraper
        run: python scraper.py
        env:
          # No secret keys needed — uses only free public scraping
          PYTHONUNBUFFERED: "1"

      # ── 5. Commit & push data -------------------------------------------
      - name: Commit and push scraped data
        run: python push_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
